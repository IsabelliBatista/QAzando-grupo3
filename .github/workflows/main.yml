name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: playwright-project/package-lock.json

      - name: Install dependencies
        working-directory: playwright-project
        run: npm ci

      - name: Install Playwright browsers
        working-directory: playwright-project
        run: npx playwright install --with-deps chromium

      - name: Run tests
        working-directory: playwright-project
        run: npm test
        env:
          CI: true
          BASE_URL: https://ingles-qazando.com

      - name: Generate Allure report
        if: always()
        working-directory: playwright-project
        run: npm run allure:generate

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: playwright-project/allure-report/
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-project/playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: playwright-project/test-results/
          retention-days: 7
